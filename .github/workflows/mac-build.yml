name: mac-build
# macOS build + first-look screenshot (2026-08-04). There is no Mac hardware
# on the dev machine, so this runner is both the compiler AND the only pair of
# eyes: it builds the dmg/zip, LAUNCHES the built .app, and screenshots the
# screen so the window chrome (native traffic lights against the frameless
# layout), the menu bar tray icon, and the opening surface can be reviewed
# from the artifact.
#
# MANUAL DISPATCH ONLY, deliberately: macOS runners bill at 10x the minute
# rate on private repos (free once this repo is public). Nothing here runs on
# push or on a schedule.
#
# Signing is OPT-IN per run (`signed: true`). Unsigned stays the default so
# the cheap "does it build, does it look right" loop costs no credentials and
# no notarization round-trip. See the `mac:` block in electron-builder.yml for
# what unsigned costs users (Gatekeeper prompt; no macOS auto-update).
#
# The certificate and the notarization key are REPOSITORY SECRETS, set by the
# owner in GitHub's own secret store. They are never in this repo, never in a
# log, and never handled by hand — `MAC_CSC_LINK` is the base64 of the
# Developer ID Application .p12, which electron-builder accepts directly, and
# the App Store Connect .p8 is written to a runner-local file that the last
# step deletes.
on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Architecture to build"
        required: false
        default: "arm64"
        type: choice
        options: [arm64, x64, both]
      signed:
        description: "Sign (needs the repo secrets; slower)"
        required: false
        default: false
        type: boolean
      notarize:
        description: "Notarize too. Turn OFF to isolate a signing problem."
        required: false
        default: true
        type: boolean

env:
  # The renderer/main bundles are arch-independent and nothing native ships,
  # but electron-builder still downloads an Electron binary per target arch.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "0"

jobs:
  build:
    runs-on: macos-latest
    # 90 rather than 45 (run 31069865459 measured why): signing the whole app
    # takes about a SECOND, so the 30-minute stall in run 31067856445 was
    # notarization waiting on Apple. `notarytool --wait` has no timeout of its
    # own, and a first submission from a brand-new developer account is
    # routinely far slower than the usual few minutes. The step bound below is
    # what actually caps a stall; this just has to be larger than it.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Same gates the ubuntu job runs, minus the ones that are platform
      # -independent and already covered there — this job exists for the
      # PACKAGING result, so keep it short.
      - run: pnpm build
      - run: pnpm --filter @herta/gui typecheck

      # ADR 0038: the PDF / Word extractors are pure JS, so the ubuntu suite
      # covers their logic — but pdfjs is loaded under Node with our own
      # DOMMatrix/Path2D stubs and no native canvas, and that runtime shape is
      # worth one execution on darwin. ~1 minute; the packaged-app probe below
      # is the real check, this is the cheap one that still reports if the app
      # fails to boot for an unrelated reason.
      - name: extractor tests under macOS Node (ADR 0038)
        run: pnpm exec vitest run packages/app-server/src/document-text.test.ts packages/app-server/src/attachments.test.ts

      # The App Store Connect key has to be a FILE on disk — electron-builder
      # passes APPLE_API_KEY to notarytool as a path, not as key material. Kept
      # outside the workspace so no later step can sweep it into an artifact,
      # and removed in the always() cleanup at the end of the job.
      - name: stage the notarization key
        if: ${{ inputs.signed }}
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_API_KEY_P8" ]; then
            echo "::error::signed run requested but APPLE_API_KEY_P8 secret is empty"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/asc" && chmod 700 "$RUNNER_TEMP/asc"
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey.p8"
          # Shape check only — never the contents.
          head -1 "$RUNNER_TEMP/asc/AuthKey.p8" | grep -q "BEGIN PRIVATE KEY" \
            || { echo "::error::APPLE_API_KEY_P8 is not a PEM private key"; exit 1; }
          echo "notarization key staged"

      # Refuse a signed build with missing/malformed credentials BEFORE
      # electron-builder runs — it exits 0 on missing credentials and hands
      # back an unsigned app that looks exactly like a signed one (audit S6).
      - name: gate on the signing credentials
        if: ${{ inputs.signed }}
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          export APPLE_API_KEY="$RUNNER_TEMP/asc/AuthKey.p8"
          node packages/gui/scripts/check-signing-env.mjs mac

      # Keychain setup is done HERE rather than left to electron-builder
      # (run 31065088414: it imported the certificate fine — it logged the
      # identity hash — and then `codesign` sat silent for 44 minutes until the
      # job timeout). Two headless-CI hazards, both invisible as a hang:
      #   - without `set-key-partition-list`, codesign asks the WindowServer for
      #     permission to use the private key and blocks on a dialog that can
      #     never be drawn.
      #   - a keychain auto-locks after 5 minutes idle by default, so a build
      #     longer than that starts failing mid-way through signing the nested
      #     helpers.
      # `-lut 21600` disables the idle lock; the partition list grants codesign
      # non-interactive access. The keychain password is generated here, lives
      # only on the runner, and dies with it.
      - name: prepare a signing keychain
        if: ${{ inputs.signed }}
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          set -eu
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS="$(openssl rand -base64 24)"
          echo "KC_PASS=$KC_PASS" >> "$GITHUB_ENV"
          echo "::add-mask::$KC_PASS"
          echo "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          # THE line that stops the hang.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KC_PASS" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

          # Hand electron-builder the prepared keychain + the identity by name,
          # so it does NOT create and import into a second one of its own.
          # Derived here rather than hardcoded — the identity carries a personal
          # name and this file is public.
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | sed -n 's/.*"\(.*\)"/\1/p' | head -1)
          if [ -z "$IDENTITY" ]; then
            echo "::error::no codesigning identity in the keychain after import"
            exit 1
          fi
          # CSC_NAME takes the name WITHOUT the certificate-type prefix —
          # electron-builder rejects the full common name outright ("Please
          # remove prefix ... appropriate certificate will be chosen
          # automatically", run 31067505136). The prefix is what
          # `security find-identity` reports, so strip it here.
          CSC_NAME_VALUE="${IDENTITY#Developer ID Application: }"
          echo "CSC_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "CSC_NAME=$CSC_NAME_VALUE" >> "$GITHUB_ENV"
          echo "identity ready: $IDENTITY"

      # A signed run is a RELEASE run, and a release that ships silent is
      # audit B3 happening again. The `dist` scripts gate on this; this
      # workflow calls electron-builder directly, so it did not. data/voice is
      # tracked in the private repo and absent from the public one, which means
      # a signed build produced in the wrong repo is silent and looks fine.
      - name: assert the voice payload is present
        if: ${{ inputs.signed }}
        working-directory: packages/gui
        run: node scripts/check-voice-payload.mjs

      # The neural-voice RUNTIME (ADR 0042 §5, ADR 0061): a native addon the
      # `dist` scripts stage into packages/gui/tts-runtime before packaging.
      # This workflow calls electron-builder directly and, until 2026-09-10,
      # never staged it — electron-builder logs one line about the missing
      # extraResources source and packages a voiceless app that looks
      # complete (the B3 pattern check-tts-payload exists for). Both darwin
      # arches are staged; the runner's own arch comes from node_modules and
      # the other is fetched with `npm install --force` (network).
      - name: stage the neural-voice runtime
        run: node packages/gui/scripts/stage-tts.mjs --mac
      - name: assert the voice runtime is staged (and the model is not)
        run: node packages/gui/scripts/check-tts-payload.mjs --strict

      - name: build the mac app
        # Measured, not guessed (run 31069865459): packaging plus the entire
        # signing walk is seconds. So 12 minutes is generous for a no-notarize
        # run and a stall there is real.
        #
        # Notarization is the slow, external, unbounded part — Apple's queue,
        # with no timeout inside `notarytool --wait`. 30 minutes was not enough
        # for this account's first submission; 75 gives it room while still
        # capping the loss, since 10x-billed macOS minutes are the scarce
        # resource here.
        timeout-minutes: ${{ inputs.notarize && 75 || 12 }}
        env:
          # CSC_LINK is deliberately ABSENT on a signed run: the certificate is
          # already in CSC_KEYCHAIN (set by the step above via GITHUB_ENV), and
          # leaving CSC_LINK set makes electron-builder import it a second time
          # into a keychain we have not configured — which is the hang.
          #
          # Unsigned runs set none of this: electron-builder then skips signing
          # and ad-hoc signs arm64, which is what macOS needs to run it at all
          # on Apple Silicon. `identity: null` must NOT come back to the yml —
          # it short-circuits before any of this is read (S6).
          APPLE_API_KEY_ID: ${{ inputs.signed && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ inputs.signed && secrets.APPLE_API_ISSUER || '' }}
          # Progress logging. `electron-builder` ALONE was not enough (run
          # 31067856445): the actual signing walk runs inside @electron/osx-sign,
          # a different debug namespace, so the log went quiet at `• signing`
          # and 30 minutes bought no information at all. Then run 31072114695
          # repeated the lesson one module later: notarization lives in
          # @electron/notarize, yet another namespace, and its wait was 74
          # minutes of silence. Cover all three; the wildcards absorb the
          # package renames across builder versions.
          DEBUG: ${{ inputs.signed && 'electron-builder*,*osx-sign*,*notarize*' || '' }}
        run: |
          ARCH_FLAG=""
          case "${{ inputs.arch }}" in
            arm64) ARCH_FLAG="--arm64" ;;
            x64)   ARCH_FLAG="--x64" ;;
            both)  ARCH_FLAG="--arm64 --x64" ;;
          esac
          # hardenedRuntime and notarize are OFF in the yml on purpose — both
          # are meaningless on an unsigned build — so a signed run turns them
          # on here, the same way `pnpm dist:release:mac` does locally.
          SIGN_FLAGS=""
          if [ "${{ inputs.signed }}" = "true" ]; then
            SIGN_FLAGS="-c.mac.hardenedRuntime=true"
            if [ "${{ inputs.notarize }}" = "true" ]; then
              export APPLE_API_KEY="$RUNNER_TEMP/asc/AuthKey.p8"
              SIGN_FLAGS="$SIGN_FLAGS -c.mac.notarize=true"
            else
              # Must be an explicit false. electron-builder 26 notarizes a
              # Developer ID build BY DEFAULT, so merely omitting the flag
              # leaves notarization on and it dies on the missing credentials
              # instead (run 31069865459) — which is not the isolation we asked
              # for.
              SIGN_FLAGS="$SIGN_FLAGS -c.mac.notarize=false"
              echo "::notice::notarization DISABLED for this run (isolating signing)"
            fi
          fi
          pnpm --filter @herta/gui exec electron-vite build
          # Same gate the dist scripts run (audit BL26): the notices file must
          # match the bundle just built, or a signed release ships a library
          # without its license text.
          node packages/gui/scripts/third-party-notices.mjs --check
          pnpm --filter @herta/gui exec electron-builder --mac $ARCH_FLAG \
            $SIGN_FLAGS --publish never

      # When the build step fails or times out on a notarizing run, ask APPLE
      # what happened before the job ends (run 31072114695: `notarytool --wait`
      # is silent while it waits, and when the step timed out the wait died
      # with it — 74 minutes, no verdict, nothing to act on). The submission
      # record is server-side; `history` says whether the upload arrived and
      # whether it is In Progress / Accepted / Invalid, and `log` carries
      # Apple's per-file reason on an Invalid. Key is still staged — the shred
      # step runs later.
      - name: notarization post-mortem
        if: ${{ failure() && inputs.signed && inputs.notarize }}
        timeout-minutes: 6
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          KEY="$RUNNER_TEMP/asc/AuthKey.p8"
          xcrun notarytool history --key "$KEY" \
            --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" || exit 0
          ID=$(xcrun notarytool history --key "$KEY" \
            --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" \
            --output-format json | jq -r '.history[0].id // empty')
          if [ -z "$ID" ]; then
            echo "::notice::no submissions on record — the upload never reached Apple"
            exit 0
          fi
          xcrun notarytool log "$ID" --key "$KEY" \
            --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" \
            || echo "(no log yet — submission still in progress)"

      # Packaging invariant, mirrored from the ubuntu job: the shipped app has
      # no node_modules, so the main bundle must not reference native code.
      - name: assert no native refs in the main bundle
        run: "! grep -rqE 'better-sqlite3|node-gyp-build' packages/gui/out/main"

      - name: list what was produced
        run: ls -lh packages/gui/release/ || true

      # The source tree having voice does not prove the BUNDLE has it — the
      # extraResources filter, the path, or the arch layout could all drop it
      # silently. Check the artifact a user would actually install.
      - name: assert the voice clips reached the .app
        if: ${{ inputs.signed }}
        run: |
          # EVERY bundle, not `head -1`. An `arch: both` run writes release/mac
          # (x64) AND release/mac-arm64, and checking only the first leaves the
          # other shipping unasserted — see the launch step for how that bit us.
          FOUND=0
          for APP in $(find packages/gui/release -maxdepth 3 -name "Herta.app" -type d); do
            FOUND=$((FOUND + 1))
            COUNT=$(find "$APP/Contents/Resources/voice" -name '*.opus' 2>/dev/null | wc -l | tr -d ' ')
            echo "voice clips in $APP: $COUNT"
            if [ "$COUNT" -lt 1 ]; then
              echo "::error::$APP contains NO voice clips — it would ship silent"
              exit 1
            fi
          done
          if [ "$FOUND" -eq 0 ]; then echo "::error::no .app produced"; exit 1; fi

      # The staged runtime having existed does not prove it reached the .app
      # either (the extraResources path, a filter, the arch layout). Check the
      # artifact: every .app must carry at least one platform addon under
      # Contents/Resources/tts-runtime — and, once a signed run has passed
      # this, ADR 0042 §7.2's "unverified on the runner" is answered.
      - name: assert the voice runtime reached the .app
        run: |
          FOUND=0
          for APP in $(find packages/gui/release -maxdepth 3 -name "Herta.app" -type d); do
            FOUND=$((FOUND + 1))
            ADDONS=$(find "$APP/Contents/Resources/tts-runtime" -name 'sherpa-onnx.node' 2>/dev/null | wc -l | tr -d ' ')
            echo "voice runtime addons in $APP: $ADDONS"
            if [ "$ADDONS" -lt 1 ]; then
              echo "::error::$APP has no tts-runtime addon — it would ship without the voice"
              exit 1
            fi
          done
          if [ "$FOUND" -eq 0 ]; then echo "::error::no .app produced"; exit 1; fi

      # Signature verification (audit 2026-08-05, S6). A green build is NOT
      # evidence of a valid signature: electron-builder exits 0 when signing
      # is skipped. These are the checks a user's machine actually performs,
      # so they are the only ones worth trusting from here — there is no Mac
      # on the dev machine to try the .app on.
      #   codesign --verify : the signature is well-formed and covers the app
      #   spctl --assess    : Gatekeeper's own verdict on the download
      #   stapler validate  : the notarization ticket is attached
      # Reported, never fatal, while the build is deliberately unsigned; the
      # release job flips SIGNED=1 to make them required.
      # continue-on-error is CONDITIONAL: with it unconditionally true, the
      # `exit 1` below would mark the step failed and let the job go green
      # anyway — which is the exact "a green build is not evidence of a
      # signature" trap this step exists to close. Advisory when unsigned,
      # required when signed.
      - name: verify the signature the way a user's Mac will
        continue-on-error: ${{ !inputs.signed }}
        env:
          SIGNED: ${{ inputs.signed && '1' || '0' }}
          NOTARIZED: ${{ inputs.notarize && '1' || '0' }}
        run: |
          set -x
          # EVERY bundle, not `head -1` (run 31186529225): an `arch: both` run
          # writes release/mac (x64) AND release/mac-arm64, `find` returned the
          # x64 one, and the arm64 app — the one most users download — shipped
          # with its signature, Gatekeeper verdict and staple never asserted.
          APPS=$(find packages/gui/release -maxdepth 3 -name "Herta.app" -type d)
          if [ -z "$APPS" ]; then echo "no .app produced"; exit 0; fi
          RC=0
          for APP in $APPS; do
            echo "=== $APP ==="
            # Required whenever we signed at all.
            codesign --verify --deep --strict --verbose=2 "$APP" || RC=1
            codesign --display --verbose=4 "$APP" 2>&1 | sed -n '1,12p' || true
            # These two are about NOTARIZATION, not signing: Gatekeeper refuses
            # a distribution build that has no ticket, and stapler has nothing
            # to validate. On a deliberate no-notarize run they are expected to
            # fail, so they must not fail the job — otherwise the isolating
            # diagnostic can never come back green and tells us nothing.
            if [ "$NOTARIZED" = "1" ]; then
              spctl --assess --type execute --verbose=4 "$APP" || RC=1
              xcrun stapler validate "$APP" || RC=1
            else
              spctl --assess --type execute --verbose=4 "$APP" || true
              xcrun stapler validate "$APP" || true
              echo "::notice::notarization was off — spctl/stapler are informational"
            fi
          done
          if [ "$RC" -ne 0 ]; then
            if [ "${SIGNED:-0}" = "1" ]; then
              echo "::error::signature verification FAILED for a signed build"
              exit 1
            fi
            echo "::notice::unsigned build — signature checks failed as expected"
          fi

      # ── The actual point: look at it ────────────────────────────────────
      # Two captures, because neither alone is enough (learned from run
      # 30915359960):
      #   - `screencapture` of the desktop shows the OS-level surface — menu
      #     bar app name, the template tray icon, the traffic lights — but the
      #     runner's display is 1024x768, SMALLER than the app's own 1280x800
      #     minimum, so the window itself lands clamped and unreadable.
      #   - the CDP probe renders the UI at real sizes regardless of that
      #     display, and re-measures the bottom-edge band on macOS.
      # Failures here must NOT fail the build — the dmg is still worth having.
      # Hang guard, learned twice on this runner:
      #   - run 30916807125 sat here 15+ minutes: a backgrounded Electron holds
      #     the step's stdout/stderr open through its HELPER processes, so the
      #     runner keeps waiting even after the launcher pid is killed.
      #   - run 30919665157 then produced NOTHING: the guard I reached for,
      #     `timeout`, is GNU coreutils and does not exist on macOS, so the
      #     probe aborted at line 6 while the step still reported success.
      #     `setsid` would have failed the same way — also Linux-only.
      # So: no external binaries. `timeout-minutes` is the runner-enforced
      # bound; `nohup … </dev/null >file 2>&1 & disown` is the portable way to
      # stop the app inheriting the step's pipes; pkill reaps by NAME because
      # the launcher pid never covered the helpers.
      - name: launch the built app, screenshot the desktop and the UI
        continue-on-error: true
        timeout-minutes: 8
        run: |
          set -x
          mkdir -p /tmp/shots
          # Launch the bundle matching the RUNNER's own CPU. `head -1` used to
          # pick release/mac — the x64 build — and on an Apple Silicon runner
          # that app cannot start, so CDP refused the connection and the whole
          # first look silently produced nothing (run 31186529225). This never
          # surfaced before because every earlier run was arm64-only, leaving
          # `find` exactly one candidate.
          case "$(uname -m)" in
            arm64)  WANT=packages/gui/release/mac-arm64 ;;
            x86_64) WANT=packages/gui/release/mac ;;
            *)      WANT= ;;
          esac
          APP=$(find "$WANT" -maxdepth 2 -name "Herta.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            # Single-arch run, or an unexpected layout: fall back to whatever
            # exists, since one bundle means no ambiguity to get wrong.
            APP=$(find packages/gui/release -maxdepth 3 -name "Herta.app" -type d | head -1)
          fi
          echo "runner arch: $(uname -m)"
          echo "app: $APP"
          if [ -z "$APP" ]; then echo "no .app produced"; exit 0; fi
          nohup "$APP/Contents/MacOS/Herta" --remote-debugging-port=9222 \
            </dev/null >/tmp/shots/herta-boot.log 2>&1 &
          disown || true
          # OS-level frame: menu bar, tray icon, window chrome.
          sleep 45
          screencapture -x /tmp/shots/desktop.png || echo "screencapture failed"
          # Confirm the debugger is actually listening before probing it, so a
          # missing port is reported here rather than as a silent empty upload.
          curl -sS --max-time 10 http://127.0.0.1:9222/json/version \
            | tee /tmp/shots/cdp-version.json || echo "NO CDP PORT"
          # Renderer frames at the darwin minimum and the default footprint,
          # plus the macOS band measurement.
          node packages/gui/scripts/mac-first-look.mjs /tmp/shots 9222 \
            >/tmp/shots/first-look.txt 2>&1 || true
          cat /tmp/shots/first-look.txt || true
          # ADR 0038: attach a PDF, a Word file, a scanned-like PDF, an
          # encrypted PDF and a legacy .doc INSIDE the packaged app — the one
          # place the lazily-imported pdfjs chunk loads from within app.asar
          # under Electron main. Prints MAC ATTACH PROBE: PASS/FAIL; the JSON
          # + PNG land in the artifact.
          node packages/gui/scripts/mac-attach-probe.mjs /tmp/shots 9222 \
            >/tmp/shots/attach-probe.txt 2>&1 || true
          cat /tmp/shots/attach-probe.txt || true
          screencapture -x /tmp/shots/desktop-settled.png || true
          echo "--- boot log ---"
          cat /tmp/shots/herta-boot.log || true
          pkill -f "Herta.app/Contents/MacOS/Herta" 2>/dev/null || true
          pkill -f "Herta Helper" 2>/dev/null || true
          sleep 2
          ls -l /tmp/shots || true

      - name: upload screenshots + boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-first-look
          path: /tmp/shots
          if-no-files-found: warn

      - name: upload the installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-dist
          path: |
            packages/gui/release/*.dmg
            packages/gui/release/*.zip
            packages/gui/release/*.blockmap
            packages/gui/release/latest-mac.yml
          if-no-files-found: warn

      # The runner is ephemeral, but do not rely on that for key material.
      - name: shred the signing material
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/asc" "$RUNNER_TEMP/cert.p12" || true
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
